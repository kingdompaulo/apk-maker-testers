name: expire apps
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: drop apps past their date
        run: |
          jq --arg t "$(date -u +%F)" '[.[] | select(.until >= $t)]' apps.json > apps.new && mv apps.new apps.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git diff --cached --quiet || { git commit -m "expire finished tests" && git push; }
